<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River POV prototype</title>
<style>
  :root { --sky: #cfe2ea; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); }
  #world { position: fixed; inset: -2%; width: 104%; height: 104%; display: block; will-change: transform; }
  #boat { position: fixed; left: 0; bottom: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
</style>
</head>
<body>
<canvas id="world"></canvas>

<!-- Foreground: the boat, wheel and otter. Bottom-anchored so phones keep the boat and crop the sides. -->
<svg id="boat" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <clipPath id="deckClip"><path d="M300 900 L880 724 L1520 900 Z"/></clipPath>
    <!-- Comic-style hatching for shade, like the otter sheet and Natural Habitat Shorts -->
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#1f1a16" stroke-width="2.2"/>
    </pattern>
    <!-- The otter cutout is split in two: body, and tail tip (so the tail can swish). -->
    <clipPath id="bodyClip"><path d="M875 442 H1125 V711 H1075 V762 H875 Z"/></clipPath>
    <clipPath id="tailClip"><rect x="1069" y="711" width="56" height="51"/></clipPath>
  </defs>

  <!-- Hull and deck: a narrow boat pointing at the bow, water visible beside it -->
  <g stroke="#1f1a16" stroke-linejoin="round" stroke-linecap="round">
    <path d="M200 900 L880 698 L1640 900 Z" fill="#a8693a" stroke-width="5"/>
    <path d="M200 900 L880 698 L1640 900 Z" fill="url(#hatch)" stroke="none" opacity=".3"/>
    <path d="M300 900 L880 724 L1520 900 Z" fill="#d39a5e" stroke-width="4"/>
    <g clip-path="url(#deckClip)" stroke-width="2.2" opacity=".75">
      <path d="M450 900 L880 724 M620 900 L880 724 M790 900 L880 724 M960 900 L880 724 M1130 900 L880 724 M1300 900 L880 724"/>
      <path d="M700 878 l12 -3 M1010 862 l10 2 M1210 884 l12 3 M560 892 l12 -4" stroke-width="1.8"/>
    </g>
    <path d="M880 698 V672" stroke-width="10"/><path d="M880 698 V672" stroke="#a8693a" stroke-width="5"/>
    <!-- coiled rope -->
    <g fill="#e3c48d" stroke-width="3">
      <ellipse cx="560" cy="866" rx="50" ry="17"/><ellipse cx="560" cy="864" rx="36" ry="12"/><ellipse cx="560" cy="862" rx="22" ry="7"/>
    </g>
    <!-- the message bottle, lying on deck -->
    <g transform="rotate(-14 700 862)" stroke-width="3">
      <rect x="652" y="850" width="74" height="26" rx="12" fill="#cfe9e4"/>
      <rect x="664" y="856" width="44" height="14" rx="3" fill="#f4ecd8" stroke-width="2"/>
      <rect x="724" y="855" width="20" height="16" rx="4" fill="#cfe9e4"/>
      <rect x="742" y="856" width="12" height="14" rx="3" fill="#b07a45"/>
    </g>
  </g>

  <!-- Ship's wheel, seen from behind the otter -->
  <path d="M992 565 H1008 V772 H992 Z" fill="#6b4428" stroke="#1f1a16" stroke-width="3.5"/>
  <g id="wheel" stroke="#1f1a16" stroke-linecap="round">
    <g fill="#6b4428" stroke-width="3.5">
      <rect x="995" y="420" width="10" height="290" rx="5" transform="rotate(0 1000 565)"/>
      <rect x="995" y="420" width="10" height="290" rx="5" transform="rotate(45 1000 565)"/>
      <rect x="995" y="420" width="10" height="290" rx="5" transform="rotate(90 1000 565)"/>
      <rect x="995" y="420" width="10" height="290" rx="5" transform="rotate(135 1000 565)"/>
    </g>
    <circle cx="1000" cy="565" r="118" fill="none" stroke-width="20"/>
    <circle cx="1000" cy="565" r="118" fill="none" stroke="#6b4428" stroke-width="12"/>
    <circle cx="1000" cy="565" r="18" fill="#6b4428" stroke-width="3.5"/>
  </g>

  <!-- Stool -->
  <g stroke="#1f1a16" stroke-linejoin="round" stroke-linecap="round">
    <path d="M935 772 L927 840 M1065 772 L1073 840 M962 772 L958 830 M1038 772 L1042 830" stroke-width="13"/>
    <path d="M935 772 L927 840 M1065 772 L1073 840 M962 772 L958 830 M1038 772 L1042 830" stroke="#b07a45" stroke-width="7"/>
    <rect x="918" y="756" width="164" height="20" rx="5" fill="#b07a45" stroke-width="4"/>
  </g>

  <!-- Otter (code puppet: breathe, sway, tail swish, little random acts) -->
  <g id="otter">
    <image id="tail" href="assets/otter-v3-back.png" x="875" y="442" width="250" height="320" clip-path="url(#tailClip)"/>
    <image id="body" href="assets/otter-v3-back.png" x="875" y="442" width="250" height="320" clip-path="url(#bodyClip)"/>
  </g>
</svg>

<script>
// ---------- River: code-drawn sky, sun and water in ink style, with the AI-drawn land on top ----------
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Everything is placed in the land image's own pixel space, then cover-fitted to the screen.
const IW = 1672, IH = 941;
const HORIZON = 554;      // where the river meets the hills, in the land image
const VX = 855;           // the river's vanishing point
const SUN = { x: 836, y: 520, r: 46 };
const INK = '#1f1a16';

const land = new Image();
land.onload = () => requestAnimationFrame(frame);
land.src = 'assets/land-v1.png';

let view = { s: 1, ox: 0, oy: 0 };
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(canvas.clientWidth * dpr); canvas.height = Math.round(canvas.clientHeight * dpr);
  const W = canvas.width, H = canvas.height, s = Math.max(W / IW, H / IH);
  // tall screens: keep the vanishing point left of centre so the otter (right of centre) doesn't cover it
  const want = W / IH / s < 1.3 ? .32 : .5;
  const ox = Math.min(0, Math.max(W - IW * s, want * W - VX * s));
  view = { s, ox, oy: (H - IH * s) / 2 };
  // Narrow screens: crop the boat around the otter, not the middle of the deck.
  const a = innerWidth / innerHeight, boat = document.getElementById('boat');
  if (a < 16/9) { const w = 900 * a; boat.setAttribute('viewBox', `${Math.max(0, Math.min(1600 - w, 960 - w/2))} 0 ${w} 900`); }
  else boat.setAttribute('viewBox', '0 0 1600 900');
}
addEventListener('resize', resize); resize();

// Wave marks: little white squiggles that start near the horizon and slide toward the boat.
const rand = (a, b) => a + Math.random() * (b - a);
const marks = Array.from({ length: 48 }, () => ({ z: Math.random(), u: rand(-1, 1), w: rand(.7, 1.4) }));
// sun streak: fixed rows of short strokes under the sun that shimmer in place
const ROWS = Array.from({ length: 9 }, (_, i) => ({ d: (i + 1) / 10, ph: Math.random() * 6.3, n: 1 + (i % 3) }));

function squiggle(x, y, len, amp){
  ctx.beginPath(); ctx.moveTo(x - len / 2, y);
  ctx.bezierCurveTo(x - len / 4, y - amp, x - len / 8, y - amp, x, y);
  ctx.bezierCurveTo(x + len / 8, y + amp * .6, x + len / 4, y + amp * .6, x + len / 2, y);
  ctx.stroke();
}

function cloud(x, y, k){
  ctx.beginPath();
  ctx.moveTo(x - 90 * k, y);
  ctx.bezierCurveTo(x - 100 * k, y - 34 * k, x - 50 * k, y - 46 * k, x - 30 * k, y - 28 * k);
  ctx.bezierCurveTo(x - 20 * k, y - 70 * k, x + 40 * k, y - 70 * k, x + 44 * k, y - 30 * k);
  ctx.bezierCurveTo(x + 80 * k, y - 46 * k, x + 110 * k, y - 10 * k, x + 90 * k, y);
  ctx.closePath();
  ctx.fillStyle = '#fff4e6'; ctx.fill();
  ctx.strokeStyle = '#e7ae86'; ctx.lineWidth = 2.5; ctx.stroke();
}

let last = 0;
function drawWorld(t){
  const dt = Math.min(.05, t - last); last = t;
  const { s, ox, oy } = view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(s, 0, 0, s, ox, oy);
  // the image space extends past the picture on very tall/wide screens: pad sky up and water down
  const top = -oy / s - 20, bottom = (canvas.height - oy) / s + 20, left = -ox / s - 20, right = (canvas.width - ox) / s + 20;

  // Sky: soft dawn, pale blue up top to peach at the horizon
  const sky = ctx.createLinearGradient(0, top, 0, HORIZON);
  sky.addColorStop(0, '#9fcbe6'); sky.addColorStop(.55, '#d9e6ea'); sky.addColorStop(1, '#fbd7b2');
  ctx.fillStyle = sky; ctx.fillRect(left, top, right - left, HORIZON - top + 2);

  // Sun: flat disc with a thin orange ink line, sitting low behind the hills
  ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r, 0, Math.PI * 2);
  ctx.fillStyle = '#ffe8a3'; ctx.fill(); ctx.strokeStyle = '#eba25c'; ctx.lineWidth = 3; ctx.stroke();

  cloud(330, 170, 1.1); cloud(1270, 120, .9); cloud(1500, 300, .6); cloud(560, 330, .5);

  // Water: flat blue
  ctx.fillStyle = '#8ec3df'; ctx.fillRect(left, HORIZON - 1, right - left, bottom - HORIZON + 1);

  // Sun streak: rows of short pale strokes under the sun that shimmer in place, not flow
  ctx.strokeStyle = '#fff3c4'; ctx.lineCap = 'round';
  for (const r of ROWS) {
    const y = HORIZON + 8 + (IH - HORIZON) * .55 * r.d * r.d;
    const half = 8 + 60 * r.d;
    ctx.lineWidth = 2 + 4 * r.d;
    for (let k = 0; k < r.n; k++) {
      const a = .45 + .45 * Math.sin(t * 1.6 + r.ph + k * 2.1);
      const off = (k - (r.n - 1) / 2) * half * 1.3 + Math.sin(t * .9 + r.ph + k) * 4;
      ctx.globalAlpha = Math.max(0, a);
      ctx.beginPath(); ctx.moveTo(SUN.x + off - half / 2, y); ctx.lineTo(SUN.x + off + half / 2, y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // Wave lines: a few long, gentle white strokes drifting slowly toward the boat
  ctx.strokeStyle = '#ffffff';
  for (const m of marks) {
    if (!reduceMotion) m.z += dt * .035 * (.3 + m.z);
    if (m.z > 1.05) { m.z -= 1.05; m.u = rand(-1, 1); }
    const z = m.z, y = HORIZON + 6 + (IH - HORIZON) * z * z;
    const x = VX + m.u * (30 + 1300 * z * z);
    if (Math.abs(x - SUN.x) < 40 + 60 * z) continue;   // leave the sun streak clear
    ctx.globalAlpha = Math.min(1, z * 5) * .85;
    ctx.lineWidth = 1.2 + 4 * z;
    squiggle(x, y, (24 + 150 * z) * m.w, .6 + 4 * z);
  }
  ctx.globalAlpha = 1;

  // Land on top (banks, trees, hills) hides the water and sun where they meet it
  ctx.drawImage(land, 0, 0, IW, IH);
}

// ---------- Otter puppet ----------
const otter = document.getElementById('otter'), tail = document.getElementById('tail'), spokes = document.getElementById('wheel');
const FEET = [1000, 762], TAIL_ROOT = [1075, 740], WHEEL = [1000, 565];
// Random little acts. Each returns lean (deg), shift (px), wheel turn (deg), wiggle, tail lift for a time 0..1.
const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
const hold = (x, a = .25, b = .75) => x < a ? ease(x/a) : x > b ? ease((1 - x)/(1 - b)) : 1;
const ACTS = {
  lookAtBirds: { dur: 3.2, f: x => ({ lean: -5 * hold(x), shift: -8 * hold(x), wheel: 0, wiggle: 0, tail: 4 * hold(x) }) },
  steer:       { dur: 2.6, f: x => ({ lean: 2.5 * Math.sin(x*Math.PI*2), shift: 0, wheel: 28 * Math.sin(x*Math.PI*2), wiggle: 0, tail: 0 }) },
  scratch:     { dur: 1.8, f: x => ({ lean: 0, shift: 0, wheel: 0, wiggle: 2.2 * Math.sin(x*Math.PI*14) * hold(x, .1, .9), tail: 10 * hold(x, .1, .9) }) },
};
let act = null, actStart = 0, nextAct = 3;
function pickAct(now){ const k = Object.keys(ACTS); act = ACTS[k[Math.floor(Math.random()*k.length)]]; actStart = now; }

function frame(ms){
  const t = reduceMotion ? 0 : ms / 1000;
  drawWorld(t);

  // The world bobs gently (we are in the boat, so the boat stays still and the world moves).
  canvas.style.transform = `translateY(${Math.sin(t*.8)*4}px) rotate(${Math.sin(t*.53)*.25}deg)`;

  let p = { lean: 0, shift: 0, wheel: 0, wiggle: 0, tail: 0 };
  if (!reduceMotion) {
    if (!act && t > nextAct) pickAct(t);
    if (act) { const x = (t - actStart) / act.dur; if (x >= 1) { act = null; nextAct = t + 4 + Math.random()*5; } else p = act.f(x); }
  }
  const breathe = 1 + Math.sin(t*2.1) * .012;
  const sway = Math.sin(t*.8) * 1.1 + p.lean + p.wiggle;
  otter.setAttribute('transform',
    `translate(${p.shift} 0) rotate(${sway} ${FEET[0]} ${FEET[1]}) translate(${FEET[0]} ${FEET[1]}) scale(1 ${breathe}) translate(${-FEET[0]} ${-FEET[1]})`);
  tail.setAttribute('transform', `rotate(${Math.sin(t*1.7)*3 - p.tail} ${TAIL_ROOT[0]} ${TAIL_ROOT[1]})`);
  spokes.setAttribute('transform', `rotate(${Math.sin(t*.8)*4 + p.wheel} ${WHEEL[0]} ${WHEEL[1]})`);
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
